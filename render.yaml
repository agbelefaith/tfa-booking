# Infrastructure as code: Render reads this file and builds both services.
services:
  # The API (FastAPI)
  - type: web
    name: tfa-booking-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Bring the database up to date, then start the server
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # you paste this in (Neon connection string)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true # Render makes a long random one for you
      - key: FRONTEND_URL
        value: https://tfa-booking-site.onrender.com
      - key: PUBLIC_URL
        value: https://tfa-booking-api.onrender.com

  # The booking website (React, built into plain files)
  - type: web
    name: tfa-booking-site
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tfa-booking-api.onrender.com
    # Send every page (/admin, /booking/success...) to the React app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
